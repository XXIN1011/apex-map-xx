<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>APEX 排位地图轮换 · 赛季 30</title>
<style>
  :root{
    --bg1:#0b0e17; --bg2:#11162a;
    --card:#161c30;
    --text:#e8ecf7; --muted:#8a93b8;
    --accent:#ff8a4d; --alt:#ffd479;
    --border:rgba(255,255,255,.07);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text);
    background:
      radial-gradient(1200px 600px at 20% -10%, rgba(255,138,77,.10), transparent 60%),
      radial-gradient(900px 500px at 90% 10%, rgba(94,210,255,.08), transparent 60%),
      linear-gradient(160deg, var(--bg1), var(--bg2));
    min-height:100vh; padding:28px 20px 60px;
  }
  .wrap{max-width:760px;margin:0 auto}
  .top{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap}
  .brand{display:flex;align-items:center}
  .brand h1{font-size:22px;font-weight:800;letter-spacing:.5px}
  .badge{background:rgba(255,138,77,.14);color:var(--accent);border:1px solid rgba(255,138,77,.35);
    padding:6px 12px;border-radius:20px;font-size:12.5px;font-weight:700;letter-spacing:.5px}

  .hero{position:relative;border-radius:20px;padding:28px;overflow:hidden;
    background:var(--card);border:1px solid var(--border);box-shadow:0 20px 60px rgba(0,0,0,.35)}
  .hero::before{content:"";position:absolute;inset:0;opacity:.22;
    background:radial-gradient(600px 300px at 90% -20%, var(--accent), transparent 60%);pointer-events:none}
  .hero .tag{font-size:12px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;font-weight:700;margin-bottom:10px}
  .hero .mname{font-size:46px;font-weight:900;line-height:1.05;letter-spacing:-.5px;color:#fff}
  .hero .meng{color:var(--muted);font-size:16px;margin-top:6px;font-weight:600;letter-spacing:1px}
  .count{display:flex;align-items:baseline;gap:14px;margin-top:24px;flex-wrap:wrap}
  .count .big{font-size:34px;font-weight:900;color:#fff;font-variant-numeric:tabular-nums}
  .count .lbl{color:var(--muted);font-size:13px}
  .bar{height:10px;border-radius:6px;background:rgba(255,255,255,.08);margin-top:14px;overflow:hidden;position:relative}
  .bar .fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--alt));
    transition:width .5s linear;box-shadow:0 0 16px var(--accent)}
  .barrow{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:8px}

  .next{margin-top:22px;padding-top:20px;border-top:1px solid var(--border)}
  .next .nlbl{font-size:12px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;font-weight:700;margin-bottom:10px}
  .next .nrow{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .next .nname{font-size:20px;font-weight:800;color:var(--alt)}
  .next .ntime{color:var(--muted);font-size:13px}
  .next .ntime b{color:var(--text);font-weight:600}

  .sched{margin-top:16px;background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden}
  .sched .head{padding:18px;display:flex;justify-content:space-between;align-items:center}
  .sched .head h3{font-size:13px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;font-weight:700}
  .sched ul{list-style:none}
  .sched li{display:flex;align-items:center;gap:14px;padding:13px 18px;border-top:1px solid var(--border)}
  .sched li.cur{background:linear-gradient(90deg, rgba(255,138,77,.10), transparent)}
  .pill{flex:none;padding:4px 10px;border-radius:14px;font-size:11.5px;font-weight:700}
  .now .pill{background:var(--accent);color:#0b0e17}
  .soon .pill{background:rgba(255,255,255,.10);color:var(--muted)}
  .smap{flex:1;font-weight:700;font-size:15px}
  .stime{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}

  @media(max-width:560px){.hero .mname{font-size:34px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <h1>APEX 排位地图轮换</h1>
    </div>
    <div class="badge">赛季 30 · 每张 4 小时 30 分 · 三图循环</div>
  </div>

  <div class="hero">
    <div class="tag">当前排位地图</div>
    <div class="mname" id="mname">—</div>
    <div class="meng" id="meng">—</div>
    <div class="count">
      <span class="big" id="countdown">—</span>
      <span class="lbl">后切换下一张</span>
    </div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="barrow">
      <span id="stime">—</span>
      <span id="etime">—</span>
    </div>
    <div class="next">
      <div class="nlbl">下一张</div>
      <div class="nrow">
        <span class="nname" id="nname">—</span>
        <span class="ntime" id="ntime">—</span>
      </div>
    </div>
  </div>

  <div class="sched">
    <div class="head">
      <h3>近期轮换排期</h3>
      <span id="tznote" style="font-size:12px;color:var(--muted)">—</span>
    </div>
    <ul id="sched"></ul>
  </div>
</div>

<script>
(function(){
  var POOL = [
    { name:'世界尽头', en:"World's Edge", accent:'#ff8a4d', alt:'#ffd479' },
    { name:'风暴点',   en:'Storm Point',   accent:'#52d273', alt:'#5fd4ff' },
    { name:'电力区',   en:'E-District',    accent:'#7ee0ff', alt:'#c2a3ff' }
  ];
  var DUR_MIN   = 270;
  var ANCHOR_MS = Date.parse('2026-09-10T02:00:00+00:00'); // 世界尽头起点(按游戏实测校准)
  var BLOCK_MS  = DUR_MIN*60*1000;
  var CYCLE_MS  = BLOCK_MS*3;

  function state(nowMs){
    var elapsed = nowMs - ANCHOR_MS;
    var cyclePos = ((elapsed % CYCLE_MS) + CYCLE_MS) % CYCLE_MS;
    var idx = Math.floor(cyclePos / BLOCK_MS);
    var within = cyclePos % BLOCK_MS;
    var cycleBase = nowMs - cyclePos;
    var blockStart = cycleBase + idx*BLOCK_MS;
    var blockEnd = blockStart + BLOCK_MS;
    return {
      map: POOL[idx], idx: idx,
      blockStart: blockStart, blockEnd: blockEnd,
      progress: within / BLOCK_MS,
      remainingSec: (BLOCK_MS - within)/1000
    };
  }

  var $ = function(id){ return document.getElementById(id); };
  function fmtTime(ms){
    return new Date(ms).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  }
  function fmtDateTime(ms){
    var d = new Date(ms);
    var mo = d.getMonth()+1, da = d.getDate();
    return (mo<10?'0':'')+mo+'/'+(da<10?'0':'')+da+' '+
           (d.getHours()<10?'0':'')+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes();
  }
  function fmtRemain(sec){
    if(sec<0) sec=0;
    var h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60);
    return h+'小时 '+(m<10?'0':'')+m+'分';
  }
  function mmss(sec){
    sec=Math.max(0,sec|0);
    var h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
    if(h>0) return h+':'+(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
    return m+':'+(s<10?'0':'')+s;
  }
  function pad(n){ return (n<10?'0':'')+n; }

  // 动态本地时间，每秒刷新
  function updateTz(){
    var d = new Date();
    var tz = '本地';
    try {
      var parts = new Intl.DateTimeFormat([], {timeZoneName:'short'}).formatToParts(d);
      var t = parts.filter(function(p){return p.type==='timeZoneName';})[0];
      if(t) tz = t.value;
    } catch(e){}
    $('tznote').textContent = '本地时间 ' + d.getFullYear()+'/'+pad(d.getMonth()+1)+'/'+pad(d.getDate())
      + ' ' + pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()) + ' ' + tz;
  }

  function renderCards(){
    var st = state(Date.now());
    var m = st.map;
    $('mname').textContent = m.name;
    $('meng').textContent = m.en;
    document.documentElement.style.setProperty('--accent', m.accent);
    document.documentElement.style.setProperty('--alt', m.alt);
    $('stime').textContent = '开始 ' + fmtDateTime(st.blockStart);
    $('etime').textContent = '结束 ' + fmtDateTime(st.blockEnd);

    var next = POOL[(st.idx+1)%3];
    $('nname').textContent = next.name;
    $('ntime').innerHTML = '于 <b>' + fmtDateTime(st.blockEnd) + '</b> 进入（' + fmtRemain(st.remainingSec) + '）';
  }

  function renderSchedule(){
    var st = state(Date.now());
    var start = st.blockStart;
    var html = '';
    for(var i=0;i<8;i++){
      var bs = start + i*BLOCK_MS;
      var be = bs + BLOCK_MS;
      var map = POOL[(st.idx + i) % 3];
      var isCur = (i===0);
      html += '<li class="'+(isCur?'cur':'')+'">'+
        '<span class="pill '+(isCur?'now':'soon')+'">'+(isCur?'现在':'排期')+'</span>'+
        '<span class="smap">'+map.name+'</span>'+
        '<span class="stime">'+fmtDateTime(bs)+' — '+fmtTime(be)+'</span>'+
      '</li>';
    }
    $('sched').innerHTML = html;
  }

  function tick(){
    renderCards();
    updateTz();
    var st = state(Date.now());
    $('countdown').textContent = mmss(st.remainingSec);
    $('fill').style.width = (st.progress*100).toFixed(2)+'%';
  }
  tick();
  setInterval(tick, 1000);
  setInterval(renderSchedule, 30000);
  renderSchedule();
})();
</script>
</body>
</html>
