<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>APEX 排位地图轮换 · 赛季 30</title>
<meta name="theme-color" id="meta-theme" content="#0b0e17" />
<script>
/* 主题引导：在首帧之前定好主题，避免先闪一下再跳变。
   三档：auto(跟随系统) / light / dark，本地记过就用记下的，否则 auto。 */
(function(){
  var m = 'auto';
  try { var v = localStorage.getItem('apex-theme'); if (v === 'light' || v === 'dark' || v === 'auto') m = v; } catch(e){}
  var dark = true;
  try { dark = !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches); } catch(e){}
  var t = (m === 'auto') ? (dark ? 'dark' : 'light') : m;
  var r = document.documentElement;
  r.setAttribute('data-theme', t);
  r.setAttribute('data-theme-mode', m);
  var meta = document.getElementById('meta-theme');
  if (meta) meta.setAttribute('content', t === 'dark' ? '#0b0e17' : '#f7f8fc');
})();
</script>
<style>
  :root{
    color-scheme:light;

    /* 地图主题色：-l 浅色主题用，-d 深色主题用（JS 按当前地图写入） */
    --accent-l:#b23a06; --alt-l:#9a6a08;
    --accent-d:#ff8a4d; --alt-d:#ffd479;

    /* 中性色（浅色主题） */
    --bg1:#f7f8fc; --bg2:#e9edf8;
    --card:#ffffff;
    --text:#1b2033; --muted:#616884; --heading:#0e1226; --on-accent:#ffffff;
    --border:rgba(20,26,52,.09);
    --track:rgba(20,26,52,.08);
    --curbg:rgba(20,26,52,.04);
    --chip:rgba(20,26,52,.06);
    --sb:rgba(20,26,52,.22);
    --card-shadow:0 18px 44px rgba(23,33,72,.10);
    --wash:.09;
    --glowA:rgba(255,150,90,.18); --glowB:rgba(90,170,255,.16);
    --glow:color-mix(in srgb, var(--accent) 45%, transparent);
    --accent-soft:color-mix(in srgb, var(--accent) 8%, transparent);
    --accent-line:color-mix(in srgb, var(--accent) 32%, transparent);

    /* 当前生效的强调色 */
    --accent:var(--accent-l); --alt:var(--alt-l);
  }
  :root[data-theme="dark"]{
    color-scheme:dark;

    --bg1:#0b0e17; --bg2:#11162a;
    --card:#161c30;
    --text:#e8ecf7; --muted:#8a93b8; --heading:#ffffff; --on-accent:#0b0e17;
    --border:rgba(255,255,255,.07);
    --track:rgba(255,255,255,.08);
    --curbg:rgba(255,255,255,.05);
    --chip:rgba(255,255,255,.10);
    --sb:rgba(255,255,255,.20);
    --card-shadow:0 20px 60px rgba(0,0,0,.35);
    --wash:.22;
    --glowA:rgba(255,138,77,.10); --glowB:rgba(94,210,255,.08);
    --glow:color-mix(in srgb, var(--accent) 85%, transparent);
    --accent-soft:color-mix(in srgb, var(--accent) 14%, transparent);
    --accent-line:color-mix(in srgb, var(--accent) 35%, transparent);

    --accent:var(--accent-d); --alt:var(--alt-d);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  /* 不给 body 定高：让它的盒子跟着内容长高，背景才铺满整篇（否则渐变只到 100vh，
     短屏/平板上排期框会有一截落在背景之外）。手机布局在下面的媒体查询里自带 height。 */
  html{background:var(--bg1)}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text);
    -webkit-text-size-adjust:100%;
    background:
      radial-gradient(1200px 600px at 20% -10%, var(--glowA), transparent 60%),
      radial-gradient(900px 500px at 90% 10%, var(--glowB), transparent 60%),
      linear-gradient(160deg, var(--bg1), var(--bg2));
    min-height:100vh; padding:28px 20px 60px;
  }
  /* 主题切换时轻微过渡（.fill 单独写，避免盖掉 width 过渡） */
  body,.hero,.sched,.badge,.pill,.themebtn,.sched li,.bar{
    transition:background-color .25s, color .25s, border-color .25s, box-shadow .25s;
  }
  .wrap{max-width:760px;margin:0 auto}
  .top{display:flex;flex-direction:column;align-items:flex-start;gap:10px;margin-bottom:20px}
  .brand{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%}
  .brand h1{font-size:22px;font-weight:800;letter-spacing:.5px}
  .badge{background:var(--accent-soft, rgba(255,138,77,.14));
    color:var(--accent);border:1px solid var(--accent-line, rgba(255,138,77,.35));
    padding:6px 12px;border-radius:20px;font-size:12.5px;font-weight:700;letter-spacing:.5px}
  .themebtn{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
    background:var(--chip);border:1px solid var(--border);color:var(--muted);cursor:pointer;
    -webkit-tap-highlight-color:transparent;padding:0}
  .themebtn:hover{color:var(--text)}
  .themebtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .ic{display:none;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}
  :root[data-theme-mode="auto"] .ic-auto{display:block}
  :root[data-theme-mode="light"] .ic-sun{display:block}
  :root[data-theme-mode="dark"] .ic-moon{display:block}

  .hero{position:relative;border-radius:20px;padding:28px;overflow:hidden;
    background:var(--card);border:1px solid var(--border);box-shadow:var(--card-shadow)}
  .hero::before{content:"";position:absolute;inset:0;opacity:var(--wash);
    background:radial-gradient(600px 300px at 90% -20%, var(--accent), transparent 60%);pointer-events:none}
  .hero .tag{font-size:12px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;font-weight:700;margin-bottom:10px}
  .hero .mname{font-size:46px;font-weight:900;line-height:1.05;letter-spacing:-.5px;color:var(--heading)}
  .hero .meng{color:var(--muted);font-size:16px;margin-top:6px;font-weight:600;letter-spacing:1px}
  .count{display:flex;align-items:baseline;gap:14px;margin-top:24px;flex-wrap:wrap}
  .count .big{font-size:34px;font-weight:900;color:var(--heading);font-variant-numeric:tabular-nums}
  .count .lbl{color:var(--muted);font-size:13px}
  .bar{height:10px;border-radius:6px;background:var(--track);margin-top:14px;overflow:hidden;position:relative}
  .bar .fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--alt));
    transition:width .5s linear, box-shadow .25s;box-shadow:0 0 16px var(--glow)}
  .barrow{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:8px}

  .next{margin-top:22px;padding-top:20px;border-top:1px solid var(--border)}
  .next .nlbl{font-size:12px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;font-weight:700;margin-bottom:10px}
  .next .nrow{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .next .nname{font-size:20px;font-weight:800;color:var(--alt)}
  .next .ntime{color:var(--muted);font-size:13px}
  .next .ntime b{color:var(--text);font-weight:600}

  .sched{margin-top:16px;background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden}
  .sched .head{padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .sched .head h3{font-size:13px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;font-weight:700}
  .sched .list{list-style:none;max-height:min(440px,52vh);overflow-y:auto;overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:thin;scrollbar-color:var(--sb) transparent}
  .sched .list::-webkit-scrollbar{width:8px}
  .sched .list::-webkit-scrollbar-thumb{background:var(--sb);border-radius:4px}
  .sched .list::-webkit-scrollbar-track{background:transparent}
  .sched li{display:flex;align-items:center;gap:14px;padding:11px 18px;border-top:1px solid var(--border)}
  .sched li.cur{background:var(--curbg);box-shadow:inset 3px 0 0 var(--accent)}
  .pill{flex:none;padding:4px 10px;border-radius:14px;font-size:11.5px;font-weight:700}
  .pill.p-now{background:var(--accent);color:var(--on-accent)}
  .pill.p-next{background:var(--chip);color:var(--muted)}
  .smap{flex:1;min-width:0;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stime{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}

  /* 手机：整屏 flex，主卡片缩小，排期框撑满剩余空间（整页不滚动，只在框内滚动） */
  @media(max-width:560px){
    body{
      min-height:0; height:100vh; height:100dvh; overflow:hidden;
      display:flex; flex-direction:column; padding:14px 12px;
    }
    .wrap{width:100%; flex:1; min-height:0; display:flex; flex-direction:column}
    .top{flex:none; margin-bottom:12px; gap:8px}
    .brand h1{font-size:19px}
    .badge{font-size:11px; padding:5px 10px}

    .hero{flex:none; padding:18px; border-radius:16px}
    .hero .tag{font-size:11px; margin-bottom:7px}
    .hero .mname{font-size:30px}
    .hero .meng{font-size:13.5px; margin-top:4px}
    .count{margin-top:14px; gap:10px}
    .count .big{font-size:26px}
    .count .lbl{font-size:12px}
    .bar{margin-top:11px}
    .barrow{font-size:11px; margin-top:6px}
    .next{margin-top:14px; padding-top:12px}
    .next .nlbl{margin-bottom:7px}
    .next .nname{font-size:17px}
    .next .ntime{font-size:12.5px}

    .sched{flex:1; min-height:0; display:flex; flex-direction:column; margin-top:12px; border-radius:14px}
    .sched .head{flex:none; padding:11px 15px}
    .sched .head h3{font-size:12px}
    .sched .list{flex:1; min-height:0; max-height:none; overflow-y:auto}
    .sched li{padding:10px 15px; gap:10px}
    .pill{font-size:11px; padding:3px 9px}
    .smap{font-size:14px}
    .stime{font-size:11.5px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <h1>APEX 排位地图轮换</h1>
      <button class="themebtn" id="themebtn" type="button" aria-label="切换浅色 / 深色主题" title="切换浅色 / 深色主题">
        <svg class="ic ic-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.1"/><path d="M12 2.4v2.3M12 19.3v2.3M2.4 12h2.3M19.3 12h2.3M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"/></svg>
        <svg class="ic ic-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.6 14.6A8.7 8.7 0 1 1 9.4 3.4a6.9 6.9 0 0 0 11.2 11.2z"/></svg>
        <svg class="ic ic-auto" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.6"/><path d="M12 3.4a8.6 8.6 0 0 1 0 17.2z" fill="currentColor" stroke="none"/></svg>
      </button>
    </div>
    <div class="badge">赛季 30 · 每张 4 小时 30 分 · 三图循环</div>
  </div>

  <div class="hero">
    <div class="tag">当前排位地图</div>
    <div class="mname" id="mname">—</div>
    <div class="meng" id="meng">—</div>
    <div class="count">
      <span class="big" id="countdown">—</span>
      <span class="lbl">后切换下一张</span>
    </div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="barrow">
      <span id="stime">—</span>
      <span id="etime">—</span>
    </div>
    <div class="next">
      <div class="nlbl">下一张</div>
      <div class="nrow">
        <span class="nname" id="nname">—</span>
        <span class="ntime" id="ntime">—</span>
      </div>
    </div>
  </div>

  <div class="sched">
    <div class="head">
      <h3>后续轮换排期</h3>
      <span id="tznote" style="font-size:12px;color:var(--muted)">—</span>
    </div>
    <ul id="sched" class="list"></ul>
  </div>
</div>

<script>
(function(){
  var POOL = [
    { name:'奥林匹斯', en:'Olympus',      al:'#3a4ccf', bl:'#7038c4', ad:'#8b9dff', bd:'#c2a3ff' },
    { name:'残月',     en:'Broken Moon',  al:'#0a6f92', bl:'#0a5f7d', ad:'#5fd4ff', bd:'#7ee0ff' },
    { name:'世界尽头', en:"World's Edge", al:'#b23a06', bl:'#9a6a08', ad:'#ff8a4d', bd:'#ffd479' }
  ];
  var DUR_MIN   = 270;
  var ANCHOR_MS = Date.parse('2026-09-16T11:00:00+00:00'); // 奥林匹斯起点(北京 9/16 19:00 · Split 2 实测校准)
  var BLOCK_MS  = DUR_MIN*60*1000;
  var CYCLE_MS  = BLOCK_MS*3;

  // 赛段：9/16 01:00 起，6 周
  var SPLIT_START_MS = Date.parse('2026-09-16T01:00:00+08:00');
  var SPLIT_END_MS   = SPLIT_START_MS + 6*7*24*60*60*1000;

  var THEME_KEY   = 'apex-theme';
  var THEME_MODES = ['auto','light','dark'];          // 点一下换下一档：自动 → 浅色 → 深色 → 自动
  var THEME_LABEL = { auto:'自动（跟随系统）', light:'浅色', dark:'深色' };
  var META_BG     = { dark:'#0b0e17', light:'#f7f8fc' };

  function state(nowMs){
    var elapsed = nowMs - ANCHOR_MS;
    var cyclePos = ((elapsed % CYCLE_MS) + CYCLE_MS) % CYCLE_MS;
    var idx = Math.floor(cyclePos / BLOCK_MS);
    var within = cyclePos % BLOCK_MS;
    var cycleBase = nowMs - cyclePos;
    var blockStart = cycleBase + idx*BLOCK_MS;
    var blockEnd = blockStart + BLOCK_MS;
    return {
      map: POOL[idx], idx: idx,
      blockStart: blockStart, blockEnd: blockEnd,
      progress: within / BLOCK_MS,
      remainingSec: (BLOCK_MS - within)/1000
    };
  }

  function mapIdxAt(t){
    return (((Math.round((t - ANCHOR_MS)/BLOCK_MS)) % 3) + 3) % 3;
  }

  var $ = function(id){ return document.getElementById(id); };
  function pad(n){ return (n<10?'0':'')+n; }
  function fmtTime(ms){
    return new Date(ms).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  }
  function fmtDateTime(ms){
    var d = new Date(ms);
    return pad(d.getMonth()+1)+'/'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());
  }
  function mmss(sec){
    sec=Math.max(0,sec|0);
    var h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
    if(h>0) return h+':'+(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
    return m+':'+(s<10?'0':'')+s;
  }

  // 动态本地时间，每秒刷新
  function updateTz(){
    var d = new Date();
    var tz = '本地';
    try {
      var parts = new Intl.DateTimeFormat([], {timeZoneName:'short'}).formatToParts(d);
      var t = parts.filter(function(p){return p.type==='timeZoneName';})[0];
      if(t) tz = t.value;
    } catch(e){}
    $('tznote').textContent = '本地时间 ' + d.getFullYear()+'/'+pad(d.getMonth()+1)+'/'+pad(d.getDate())
      + ' ' + pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()) + ' ' + tz;
  }

  function renderCards(){
    var st = state(Date.now());
    var m = st.map;
    $('mname').textContent = m.name;
    $('meng').textContent = m.en;
    var rs = document.documentElement.style;
    rs.setProperty('--accent-l', m.al); rs.setProperty('--alt-l', m.bl);
    rs.setProperty('--accent-d', m.ad); rs.setProperty('--alt-d', m.bd);
    $('stime').textContent = '开始 ' + fmtDateTime(st.blockStart);
    $('etime').textContent = '结束 ' + fmtDateTime(st.blockEnd);

    var next = POOL[(st.idx+1)%3];
    $('nname').textContent = next.name;
    $('ntime').innerHTML = '于 <b>' + fmtDateTime(st.blockEnd) + '</b> 进入';
  }

  // 渲染「当前这档 → 赛段结束」的全部排期（已过的不显示）
  function renderSchedule(){
    var list = $('sched');
    var prevTop = list.scrollTop;
    var now = Date.now();
    var start = Math.max(SPLIT_START_MS, state(now).blockStart);
    var html = '';
    for(var t = start; t < SPLIT_END_MS; t += BLOCK_MS){
      var m = POOL[mapIdxAt(t)];
      var be = t + BLOCK_MS;
      var isCur = (t <= now && now < be);
      html += '<li class="'+(isCur?'cur':'')+'">'+
        '<span class="pill '+(isCur?'p-now':'p-next')+'">'+(isCur?'现在':'排期')+'</span>'+
        '<span class="smap">'+m.name+'</span>'+
        '<span class="stime">'+fmtDateTime(t)+' — '+fmtTime(be)+'</span>'+
      '</li>';
    }
    list.innerHTML = html;
    list.scrollTop = prevTop;
  }

  var lastBlock = null;
  function refreshSchedule(){
    var st = state(Date.now());
    if(st.blockStart !== lastBlock){ lastBlock = st.blockStart; renderSchedule(); }
  }

  // ---- 主题：auto(跟随系统) / light / dark 三档循环 ----
  function storedMode(){
    try{
      var v = localStorage.getItem(THEME_KEY);
      if(v === 'light' || v === 'dark' || v === 'auto') return v;
    }catch(e){}
    return 'auto';
  }
  function systemDark(){
    try{ return !!window.matchMedia('(prefers-color-scheme: dark)').matches; }catch(e){ return true; }
  }
  function resolveTheme(mode){ return mode === 'auto' ? (systemDark() ? 'dark' : 'light') : mode; }
  function nextMode(mode){
    return THEME_MODES[(THEME_MODES.indexOf(mode) + 1) % THEME_MODES.length];
  }
  function applyTheme(mode, save){
    var t = resolveTheme(mode);
    var r = document.documentElement;
    r.setAttribute('data-theme', t);        // 实际生效的明暗
    r.setAttribute('data-theme-mode', mode); // 用户选的档位（决定显示哪个图标）
    var meta = $('meta-theme');
    if(meta) meta.setAttribute('content', META_BG[t]);
    var btn = $('themebtn');
    if(btn){
      var label = '主题：' + THEME_LABEL[mode] + '（点击切换到' + THEME_LABEL[nextMode(mode)] + '）';
      btn.setAttribute('aria-label', label);
      btn.setAttribute('title', label);
    }
    if(save){ try{ localStorage.setItem(THEME_KEY, mode); }catch(e){} }
  }
  $('themebtn').addEventListener('click', function(){
    applyTheme(nextMode(storedMode()), true);
  });
  // 停在「自动」时才跟着系统走
  try{
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var onChange = function(){ if(storedMode() === 'auto') applyTheme('auto', false); };
    if(mq.addEventListener) mq.addEventListener('change', onChange);
    else if(mq.addListener) mq.addListener(onChange);
  }catch(e){}

  function tick(){
    renderCards();
    updateTz();
    var st = state(Date.now());
    $('countdown').textContent = mmss(st.remainingSec);
    $('fill').style.width = (st.progress*100).toFixed(2)+'%';
    refreshSchedule();
  }

  // 初始化：先同步渲染一帧（含倒计时与进度条，首帧即出），再启动每秒刷新
  tick();
  applyTheme(storedMode(), false);
  lastBlock = state(Date.now()).blockStart;
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
