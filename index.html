<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>APEX 排位地图轮换</title>
<meta name="theme-color" id="meta-theme" content="#0a0d16" />
<script>
/* 主题引导：在首帧之前定好主题，避免先闪一下再跳变。
   三档：auto(跟随系统) / light / dark，本地记过就用记下的，否则 auto。 */
(function(){
  var m = 'auto';
  try { var v = localStorage.getItem('apex-theme'); if (v === 'light' || v === 'dark' || v === 'auto') m = v; } catch(e){}
  var dark = true;
  try { dark = !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches); } catch(e){}
  var t = (m === 'auto') ? (dark ? 'dark' : 'light') : m;
  var r = document.documentElement;
  r.setAttribute('data-theme', t);
  r.setAttribute('data-theme-mode', m);
  var meta = document.getElementById('meta-theme');
  if (meta) meta.setAttribute('content', t === 'dark' ? '#0a0d16' : '#eef0f7');
})();
</script>
<style>
  /* ── 设计令牌 ─────────────────────────────────────────────────────────
     半径：卡片 / 内部块 / 胶囊；间距 4·8·12·16·24·32；字号 12 起（正文不缩到 12 以下）；
     两层阴影 e1(排期卡) / e2(主卡)。颜色全走变量，浅深两套。 */
  :root{
    color-scheme:light;

    --r-card:16px; --r-inner:10px; --r-pill:999px;
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px;
    --fs-cap:13px; --fs-sm:13.5px; --fs-md:15px; --fs-lg:20px; --fs-xl:34px; --fs-2xl:46px;

    /* 地图主题色：-l 浅色主题用，-d 深色主题用，JS 按当前地图写入。 */
    --accent-l:#b23a06; --alt-l:#9a6a08;
    --accent-d:#ff8a4d; --alt-d:#ffd479;

    /* 中性色（浅色主题） */
    --bg:#eef0f7; --card:#ffffff;
    --text:#1b2033; --muted:#505b73; --heading:#0f1329; --on-accent:#ffffff;
    --border:rgba(18,24,48,.10); --track:rgba(18,24,48,.09); --chip:rgba(18,24,48,.06);
    --curbg:color-mix(in srgb, var(--accent) 7%, transparent);
    --sb:rgba(18,24,48,.20);
    --e1:0 1px 2px rgba(19,28,64,.05), 0 8px 20px rgba(19,28,64,.05);
    --e2:0 2px 4px rgba(19,28,64,.05), 0 20px 44px rgba(19,28,64,.10);
    --accent-soft:color-mix(in srgb, var(--accent) 8%, transparent);
    --accent-line:color-mix(in srgb, var(--accent) 30%, transparent);
    /* 徽章/日期这类「强调色当文字」的地方再压一档，保证浅底上也有余量 */
    --accent-ink:color-mix(in srgb, var(--accent) 88%, #000);

    /* 当前生效的强调色 */
    --accent:var(--accent-l); --alt:var(--alt-l);
  }
  :root[data-theme="dark"]{
    color-scheme:dark;

    --bg:#0a0d16; --card:#151a2a;
    --text:#e9edf8; --muted:#abb4d0; --heading:#ffffff; --on-accent:#0a0d16;
    --border:rgba(255,255,255,.08); --track:rgba(255,255,255,.09); --chip:rgba(255,255,255,.10);
    --curbg:color-mix(in srgb, var(--accent) 13%, transparent);
    --sb:rgba(255,255,255,.20);
    --e1:0 1px 2px rgba(0,0,0,.30), 0 8px 22px rgba(0,0,0,.26);
    --e2:0 2px 6px rgba(0,0,0,.34), 0 22px 50px rgba(0,0,0,.42);
    --accent-soft:color-mix(in srgb, var(--accent) 14%, transparent);
    --accent-line:color-mix(in srgb, var(--accent) 34%, transparent);
    /* 深色底上强调色本身就够亮，直接复用 */
    --accent-ink:var(--accent);

    --accent:var(--accent-d); --alt:var(--alt-d);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none !important}
  /* 底色改成纯色（原先那两层光晕渐变去掉，地图身份色只出现在卡片/标记上）；
     不给 body 定高：让它的盒子跟着内容长高，背景才铺满整篇。 */
  html{background:var(--bg)}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text);background:var(--bg);
    -webkit-text-size-adjust:100%;
    min-height:100vh; padding:var(--sp-6) 20px 60px;
  }
  /* 主题切换时轻微过渡（进度条不参与，它每秒都在变） */
  body,.hero,.sched,.badge,.themebtn,.list li,.bar{
    transition:background-color .25s, color .25s, border-color .25s, box-shadow .25s;
  }
  .wrap{max-width:760px;margin:0 auto}

  /* ── 页头 ───────────────────────────────────────────────────────── */
  .top{display:flex;flex-direction:column;align-items:flex-start;gap:var(--sp-3);margin-bottom:var(--sp-5)}
  .brand{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);width:100%}
  .brand h1{font-size:22px;font-weight:800;letter-spacing:.5px;color:var(--heading)}
  .theme-control{position:relative;flex:none}
  .themebtn{flex:none;min-width:44px;height:44px;padding:0 12px;border-radius:var(--r-pill);display:flex;align-items:center;justify-content:center;gap:6px;
    background:var(--chip);border:1px solid var(--border);color:var(--muted);cursor:pointer;
    -webkit-tap-highlight-color:transparent;font:inherit;font-size:12px;font-weight:600}
  .theme-menu{position:absolute;right:0;top:calc(100% + 8px);z-index:10;width:180px;
    padding:6px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-inner);box-shadow:var(--e2)}
  .theme-option{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:44px;
    padding:10px 12px;border:0;border-radius:6px;background:transparent;color:var(--text);font:inherit;font-size:14px;cursor:pointer;text-align:left}
  .theme-option:hover{background:var(--chip)}
  .theme-option[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
  .theme-option .check{visibility:hidden}
  .theme-option[aria-pressed="true"] .check{visibility:visible}
  .theme-option:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .themebtn:hover{color:var(--text)}
  .themebtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .ic{display:none;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}
  :root[data-theme-mode="auto"] .ic-auto{display:block}
  :root[data-theme-mode="light"] .ic-sun{display:block}
  :root[data-theme-mode="dark"] .ic-moon{display:block}
  .badge{background:var(--accent-soft);color:var(--accent-ink);border:1px solid var(--accent-line);
    padding:6px 12px;border-radius:var(--r-pill);font-size:var(--fs-sm);font-weight:700;letter-spacing:.4px;
    max-width:100%;line-height:1.5;white-space:normal}

  /* ── 主卡：当前地图 ─────────────────────────────────────────────── */
  .hero{position:relative;overflow:hidden;border-radius:var(--r-card);
    padding:var(--sp-6) var(--sp-5) var(--sp-5);
    background:var(--card);border:1px solid var(--border);box-shadow:var(--e2)}
  /* 地图身份：顶部一条双色发丝边（当前地图的两种主题色） */
  .hero::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--accent),var(--alt));pointer-events:none}
  .hero .tag{font-size:var(--fs-cap);letter-spacing:1.6px;color:var(--muted);font-weight:700;
    text-transform:uppercase;margin-bottom:var(--sp-2)}
  .hero .mname{font-size:var(--fs-2xl);font-weight:900;line-height:1.05;letter-spacing:-.5px;color:var(--heading)}
  .hero .meng{color:var(--muted);font-size:16px;margin-top:6px;font-weight:600;letter-spacing:.8px}
  .hero[data-status="inactive"] .mname{font-size:clamp(22px,5vw,34px);line-height:1.3}

  .count{display:flex;align-items:baseline;gap:var(--sp-3);margin-top:var(--sp-5);flex-wrap:wrap}
  .count .big{font-size:var(--fs-xl);font-weight:900;color:var(--heading);font-variant-numeric:tabular-nums}
  .count .lbl{color:var(--muted);font-size:14px}

  .bar{height:8px;border-radius:var(--r-pill);background:var(--track);margin-top:var(--sp-3);overflow:hidden}
  /* 进度每秒只走 0.006%：过渡反而像在动，直接瞬时更新（也就没有动画要迁就 reduced-motion） */
  .bar .fill{height:100%;width:0;border-radius:var(--r-pill);
    background:linear-gradient(90deg,var(--accent),var(--alt))}
  .barrow{display:flex;justify-content:space-between;gap:var(--sp-3);color:var(--muted);
    font-size:var(--fs-cap);margin-top:var(--sp-2);font-variant-numeric:tabular-nums}

  .next{margin-top:var(--sp-5);padding-top:var(--sp-4);border-top:1px solid var(--border)}
  .next .nlbl{font-size:var(--fs-cap);letter-spacing:1px;color:var(--muted);font-weight:700;
    text-transform:uppercase;margin-bottom:6px}
  .next .nrow{display:flex;align-items:baseline;gap:var(--sp-3);flex-wrap:wrap}
  .next .nname{font-size:var(--fs-lg);font-weight:800;color:var(--accent-ink)}
  .next .ntime{color:var(--muted);font-size:14px}
  .next .ntime b{color:var(--text);font-weight:600}

  /* ── 排期卡 ─────────────────────────────────────────────────────── */
  .sched{position:relative;margin-top:var(--sp-4);background:var(--card);border:1px solid var(--border);
    border-radius:var(--r-card);box-shadow:var(--e1);overflow:hidden}
  .sched .head{padding:var(--sp-4) 18px;display:flex;justify-content:space-between;align-items:center;gap:var(--sp-3)}
  .sched .head h2{flex:none;font-size:14px;letter-spacing:.5px;color:var(--text);
    text-transform:uppercase;font-weight:700;white-space:nowrap}
  .sched .head .tz{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-size:var(--fs-cap);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
  /* 底部渐隐：提示还能往下滚；配合 .list 的 padding-bottom，滚到底时末行不会被盖住 */
  .sched::after{content:"";position:absolute;left:0;right:0;bottom:0;height:22px;pointer-events:none;
    background:linear-gradient(180deg, transparent, var(--card))}
  .list{list-style:none;max-height:min(460px,58vh);overflow-y:auto;overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;padding-bottom:22px;
    scrollbar-width:thin;scrollbar-color:var(--sb) transparent}
  .list::-webkit-scrollbar{width:8px}
  .list::-webkit-scrollbar-thumb{background:var(--sb);border-radius:4px}
  .list::-webkit-scrollbar-track{background:transparent}
  /* 日期分组：贴在滚动容器顶部，长列表里始终知道在看哪一天 */
  .list li.day{position:sticky;top:0;z-index:1;background:var(--card);
    padding:10px 18px 6px;font-size:var(--fs-cap);font-weight:700;letter-spacing:.6px;color:var(--muted);
    border-top:1px solid var(--border);font-variant-numeric:tabular-nums}
  .list li.day:first-child{border-top:0}
  .list li.day .today{color:var(--accent-ink)}
  .list li.row{display:flex;align-items:center;gap:10px;padding:0 18px;min-height:46px;
    border-top:1px solid var(--border)}
  .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--mc,var(--muted))}
  .dot{--mc:var(--dot-l)}
  :root[data-theme="dark"] .dot{--mc:var(--dot-d)}
  .list li.empty{padding:var(--sp-5) 18px;color:var(--muted);font-size:var(--fs-md);line-height:1.6}
  .smap{flex:1 1 auto;min-width:0;font-weight:700;font-size:var(--fs-md);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stime{flex:none;color:var(--muted);font-weight:500;font-size:var(--fs-sm);font-variant-numeric:tabular-nums;white-space:nowrap}
  /* 当前这张：左侧强调条 + 「现在」标签（不只靠颜色区分）；每行重复的「排期」标签一律省掉 */
  .list li.cur{background:var(--curbg);box-shadow:inset 3px 0 0 var(--accent)}
  .list li.cur .smap{color:var(--heading)}
  .pnow{flex:none;padding:3px 9px;border-radius:var(--r-pill);font-size:var(--fs-cap);font-weight:700;
    letter-spacing:.3px;background:var(--accent);color:var(--on-accent)}

  /* ── 手机：整屏 flex，主卡缩小，排期框撑满剩余空间（整页不滚动） ──── */
  @media(max-width:560px){
    body{
      min-height:0; height:100vh; height:100dvh; overflow:hidden;
      display:flex; flex-direction:column;
      padding:calc(14px + env(safe-area-inset-top,0px)) 12px calc(14px + env(safe-area-inset-bottom,0px));
    }
    .wrap{width:100%; flex:1; min-height:0; display:flex; flex-direction:column}
    .top{flex:none; margin-bottom:var(--sp-3); gap:var(--sp-2)}
    .brand h1{font-size:19px}
    .badge{font-size:var(--fs-cap); padding:5px 10px}

    .hero{flex:none; padding:var(--sp-4); border-radius:14px}
    .hero .tag{font-size:var(--fs-cap); margin-bottom:6px}
    .hero .mname{font-size:32px}
    .hero .meng{font-size:13.5px; margin-top:4px}
    .count{margin-top:var(--sp-4); gap:10px}
    .count .big{font-size:28px}
    .count .lbl{font-size:13px}
    .bar{margin-top:11px}
    .barrow{font-size:var(--fs-cap); margin-top:6px}
    .next{margin-top:var(--sp-3); padding-top:var(--sp-3)}
    .next .nlbl{margin-bottom:6px}
    .next .nname{font-size:17px}
    .next .ntime{font-size:var(--fs-cap)}

    .sched{flex:1; min-height:0; display:flex; flex-direction:column;
      margin-top:var(--sp-3); border-radius:14px}
    .sched .head{flex:none; padding:11px 14px}
    .list{flex:1; min-height:0; max-height:none}
    .list li.day{padding:9px 14px 5px}
    .list li.row{padding:0 14px; min-height:44px; gap:9px}
    .smap{font-size:15px}
    .stime{font-size:12.5px}
    .pnow{font-size:var(--fs-cap); padding:3px 8px}
  }
  /* 矮屏（320×568 这类）：主卡再压一档，把行数留给排期 */
  @media(max-width:560px) and (max-height:720px){
    .hero{padding:var(--sp-3) var(--sp-4)}
    .hero .tag{display:none}
    .hero .mname{font-size:24px}
    .hero .meng{font-size:12.5px}
    .count{margin-top:10px}
    .count .big{font-size:24px}
    .count .lbl{font-size:var(--fs-cap)}
    .bar{margin-top:9px; height:7px}
    .next{margin-top:10px; padding-top:10px}
    .next .nname{font-size:16px}
    .sched{margin-top:10px}
    .sched .head{padding:9px 14px}
  }
  /* 尊重系统「减少动态效果」：主题切换的过渡也一并去掉 */
  @media(prefers-reduced-motion:reduce){
    *{transition:none !important; animation:none !important; scroll-behavior:auto !important}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <h1>APEX 排位地图轮换</h1>
      <div class="theme-control" id="theme-control">
      <button class="themebtn" id="themebtn" type="button" aria-label="主题：跟随系统 · 打开选择" title="主题：跟随系统 · 打开选择" aria-expanded="false" aria-controls="theme-menu">
        <svg class="ic ic-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.1"/><path d="M12 2.4v2.3M12 19.3v2.3M2.4 12h2.3M19.3 12h2.3M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"/></svg>
        <svg class="ic ic-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.6 14.6A8.7 8.7 0 1 1 9.4 3.4a6.9 6.9 0 0 0 11.2 11.2z"/></svg>
        <svg class="ic ic-auto" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.6"/><path d="M12 3.4a8.6 8.6 0 0 1 0 17.2z" fill="currentColor" stroke="none"/></svg>
        <span id="theme-label">自动</span>
      </button>
      <div class="theme-menu" id="theme-menu" role="group" aria-label="主题选择" hidden>
        <button class="theme-option" id="theme-auto" type="button" aria-pressed="true">跟随系统<span class="check" aria-hidden="true">✓</span></button>
        <button class="theme-option" id="theme-light" type="button" aria-pressed="false">浅色<span class="check" aria-hidden="true">✓</span></button>
        <button class="theme-option" id="theme-dark" type="button" aria-pressed="false">深色<span class="check" aria-hidden="true">✓</span></button>
      </div>
      </div>
    </div>
    <div class="badge" id="season-badge">正在读取赛段信息…</div>
  </div>

  <section class="hero" id="hero">
    <h2 class="tag" id="hero-tag">当前排位地图</h2>
    <div class="mname" id="mname">—</div>
    <div class="meng" id="meng">—</div>
    <div id="rotation-details">
      <div class="count">
        <span class="big" id="countdown">—</span>
        <span class="lbl" id="countdown-label">后切换地图</span>
      </div>
      <div class="bar" id="bar" role="progressbar" aria-label="当前时段进度"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="—">
        <div class="fill" id="fill"></div>
      </div>
      <div class="barrow">
        <span id="stime">—</span>
        <span id="etime">—</span>
      </div>
      <div class="next">
        <div class="nlbl">下一张地图</div>
        <div class="nrow">
          <span class="nname" id="nname">—</span>
          <span class="ntime" id="ntime">—</span>
        </div>
      </div>
    </div>
  </section>

  <section class="sched">
    <div class="head">
      <h2>后续轮换排期</h2>
      <span class="tz" id="tznote">—</span>
    </div>
    <ul id="sched" class="list"></ul>
  </section>
</div>

<script>
(function(){
  // ── 赛季配置：新赛季更新时集中修改这里 ──────────────────────────
  // maps 按轮换顺序排列；anchorAt 是 maps[0] 某一次实际开始的时间，
  // 不必等于赛段开始时间。所有时间必须带时区，+08:00 表示北京时间。
  // al/bl 是浅色主题的主色/辅色，ad/bd 是深色主题的主色/辅色。
  var SEASON = {
    number: 31,
    split: 1,
    startsAt: '2026-11-04T02:00:00+08:00',
    endsAt: '2026-12-30T02:00:00+08:00', // 暂按赛段 8 周设置，待准确结束时间确认后更新
    anchorAt: '2026-11-04T11:00:00+08:00', // 残月，按当日 15:30 结束倒推 4.5 小时校准
    durationMinutes: 270,
    maps: [
      { name:'残月',     en:'Broken Moon',  al:'#0a6f92', bl:'#0a5f7d', ad:'#5fd4ff', bd:'#7ee0ff' },
      { name:'风暴点',   en:'Storm Point',  al:'#b23a06', bl:'#9a6a08', ad:'#ff8a4d', bd:'#ffd479' },
      { name:'电力区',   en:'E-District',   al:'#3a4ccf', bl:'#7038c4', ad:'#8b9dff', bd:'#c2a3ff' }
    ]
  };

  var POOL = SEASON.maps;
  var DUR_MIN   = SEASON.durationMinutes;
  var ANCHOR_MS = Date.parse(SEASON.anchorAt);
  var BLOCK_MS  = DUR_MIN*60*1000;
  var CYCLE_MS  = BLOCK_MS*POOL.length;
  var SPLIT_START_MS = Date.parse(SEASON.startsAt);
  var SPLIT_END_MS   = Date.parse(SEASON.endsAt);

  var THEME_KEY    = 'apex-theme';                     // 键名别改，改了所有人的主题记忆就重置
  var THEME_MODES  = ['auto','light','dark'];
  var THEME_LABEL  = { auto:'跟随系统', light:'浅色', dark:'深色' };
  var META_BG      = { dark:'#0a0d16', light:'#eef0f7' };
  var WEEK         = ['周日','周一','周二','周三','周四','周五','周六'];

  function state(nowMs){
    if(nowMs < SPLIT_START_MS) return { phase:'upcoming' };
    if(nowMs >= SPLIT_END_MS) return { phase:'ended' };
    var elapsed = nowMs - ANCHOR_MS;
    var cyclePos = ((elapsed % CYCLE_MS) + CYCLE_MS) % CYCLE_MS;
    var idx = Math.floor(cyclePos / BLOCK_MS);
    var cycleBase = nowMs - cyclePos;
    var rotationStart = cycleBase + idx*BLOCK_MS;
    var blockStart = Math.max(rotationStart, SPLIT_START_MS);
    var blockEnd = Math.min(rotationStart + BLOCK_MS, SPLIT_END_MS);
    return {
      phase: 'active',
      map: POOL[idx], idx: idx,
      blockStart: blockStart, blockEnd: blockEnd,
      progress: (nowMs - blockStart) / (blockEnd - blockStart),
      remainingSec: (blockEnd - nowMs)/1000
    };
  }

  var $ = function(id){ return document.getElementById(id); };
  function pad(n){ return (n<10?'0':'')+n; }
  function fmtTime(ms){
    return new Date(ms).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  }
  function fmtDateTime(ms){
    var d = new Date(ms);
    return pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());
  }
  function dayKey(ms){
    var d = new Date(ms);
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  }
  // 日期分隔行文案：MM-DD 周X（当天在渲染处另外标「今天」）
  function fmtDayLabel(ms){
    var d = new Date(ms);
    return pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+WEEK[d.getDay()];
  }
  // 结束时间跨到第二天时直接写完整日期，不再用「次日」这种相对说法
  function fmtEndText(startMs, endMs){
    return dayKey(startMs) === dayKey(endMs) ? fmtTime(endMs) : fmtDateTime(endMs);
  }
  function mmss(sec){
    sec=Math.max(0,Math.ceil(sec));
    var h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
    if(h>0) return h+':'+(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
    return m+':'+(s<10?'0':'')+s;
  }

  // 动态本地时间，每秒刷新（年份省掉，窄屏才放得下）
  function updateTz(){
    var d = new Date();
    var tz = '本地';
    try {
      var parts = new Intl.DateTimeFormat([], {timeZoneName:'short'}).formatToParts(d);
      var t = parts.filter(function(p){return p.type==='timeZoneName';})[0];
      if(t) tz = t.value;
    } catch(e){}
    $('tznote').textContent = '本地 ' + pad(d.getMonth()+1)+'-'+pad(d.getDate())
      + ' ' + pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()) + ' ' + tz;
  }

  function renderCards(st){
    var active = st.phase === 'active';
    $('hero').setAttribute('data-status', active ? 'active' : 'inactive');
    $('rotation-details').hidden = !active;
    $('hero-tag').textContent = active ? '当前排位地图' : '赛段状态';
    if(!active){
      $('mname').textContent = st.phase === 'upcoming' ? '赛段尚未开始' : '本赛段已结束';
      $('meng').textContent = st.phase === 'upcoming'
        ? '开始时间：' + fmtDateTime(SPLIT_START_MS)
        : '等待新赛季数据更新';
      return;
    }
    var m = st.map;
    $('mname').textContent = m.name;
    $('meng').textContent = m.en;
    var rs = document.documentElement.style;
    rs.setProperty('--accent-l', m.al); rs.setProperty('--alt-l', m.bl);
    rs.setProperty('--accent-d', m.ad); rs.setProperty('--alt-d', m.bd);
    $('stime').textContent = '开始 ' + fmtDateTime(st.blockStart);
    $('etime').textContent = '结束 ' + fmtDateTime(st.blockEnd);

    var isLast = st.blockEnd === SPLIT_END_MS;
    var next = POOL[(st.idx+1)%POOL.length];
    $('countdown-label').textContent = isLast ? '后本赛段结束' : '后切换地图';
    $('nname').textContent = isLast ? '本赛段结束' : next.name;
    $('ntime').textContent = '于 ' + fmtDateTime(st.blockEnd) + (isLast ? ' 结束' : ' 开始');
  }

  // 渲染「当前这档 → 赛段结束」的全部排期（已过的不显示），按天分组
  function renderSchedule(now, st){
    var list = $('sched');
    var prevTop = list.scrollTop;
    if(st.phase === 'ended'){
      list.innerHTML = '<li class="empty">本赛段排期已结束，等待新赛季数据更新。</li>';
      return;
    }
    var start = st.phase === 'upcoming' ? SPLIT_START_MS : st.blockStart;
    var todayKey = dayKey(now);
    var html = '', lastDay = null;
    for(var t = start; t < SPLIT_END_MS; t = be){
      var slot = state(t);
      var m = slot.map;
      var be = slot.blockEnd;
      var isCur = (t <= now && now < be);
      var dk = dayKey(t);
      if(dk !== lastDay){
        lastDay = dk;
        html += '<li class="day">' + (dk === todayKey ? '<span class="today">今天</span> · ' : '')
          + fmtDayLabel(t) + '</li>';
      }
      html += '<li class="row'+(isCur?' cur':'')+'"'+(isCur?' aria-current="time"':'')+'>'+
        '<span class="dot" aria-hidden="true" style="--dot-l:'+m.al+';--dot-d:'+m.ad+'"></span>'+
        '<span class="smap">'+m.name+'</span>'+
        (isCur?'<span class="pnow">现在</span>':'')+
        '<span class="stime">'+fmtDateTime(t)+' — '+fmtEndText(t, be)+'</span>'+
      '</li>';
    }
    list.innerHTML = html;
    list.scrollTop = prevTop;
  }

  var lastCardKey = null;
  var lastScheduleKey = null;

  // ---- 主题：直接选择，按钮和菜单同时标出当前模式 ----
  function storedMode(){
    try{
      var v = localStorage.getItem(THEME_KEY);
      if(v === 'light' || v === 'dark' || v === 'auto') return v;
    }catch(e){}
    return 'auto';
  }
  function systemDark(){
    try{ return !!window.matchMedia('(prefers-color-scheme: dark)').matches; }catch(e){ return true; }
  }
  function resolveTheme(mode){ return mode === 'auto' ? (systemDark() ? 'dark' : 'light') : mode; }
  function applyTheme(mode, save){
    var t = resolveTheme(mode);
    var r = document.documentElement;
    r.setAttribute('data-theme', t);        // 实际生效的明暗
    r.setAttribute('data-theme-mode', mode); // 用户选的档位（决定显示哪个图标）
    var meta = $('meta-theme');
    if(meta) meta.setAttribute('content', META_BG[t]);
    var btn = $('themebtn');
    if(btn){
      var label = '主题：' + THEME_LABEL[mode] + ' · 打开选择';
      btn.setAttribute('aria-label', label);
      btn.setAttribute('title', label);
    }
    $('theme-label').textContent = mode === 'auto' ? '自动' : THEME_LABEL[mode];
    THEME_MODES.forEach(function(option){
      $('theme-'+option).setAttribute('aria-pressed', String(option === mode));
    });
    if(save){ try{ localStorage.setItem(THEME_KEY, mode); }catch(e){} }
  }
  function closeThemeMenu(restoreFocus){
    $('theme-menu').hidden = true;
    $('themebtn').setAttribute('aria-expanded', 'false');
    if(restoreFocus) $('themebtn').focus();
  }
  $('themebtn').addEventListener('click', function(){
    var open = $('theme-menu').hidden;
    $('theme-menu').hidden = !open;
    $('themebtn').setAttribute('aria-expanded', String(open));
    if(open) $('theme-'+document.documentElement.getAttribute('data-theme-mode')).focus();
  });
  THEME_MODES.forEach(function(mode){
    $('theme-'+mode).addEventListener('click', function(){
      applyTheme(mode, true);
      closeThemeMenu(true);
    });
  });
  document.addEventListener('click', function(event){
    if(!$('theme-control').contains(event.target)) closeThemeMenu(false);
  });
  $('theme-control').addEventListener('keydown', function(event){
    if(event.key === 'Escape' && !$('theme-menu').hidden){
      event.preventDefault();
      closeThemeMenu(true);
    }
  });
  $('theme-control').addEventListener('focusout', function(event){
    if(!$('theme-control').contains(event.relatedTarget)) closeThemeMenu(false);
  });
  // 停在「自动」时才跟着系统走
  try{
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var onChange = function(){ if(storedMode() === 'auto') applyTheme('auto', false); };
    if(mq.addEventListener) mq.addEventListener('change', onChange);
    else if(mq.addListener) mq.addListener(onChange);
  }catch(e){}

  function tick(){
    var now = Date.now();
    var st = state(now);
    var cardKey = st.phase + ':' + (st.blockStart || '');
    var scheduleKey = cardKey + ':' + dayKey(now);
    if(cardKey !== lastCardKey){
      renderCards(st);
      lastCardKey = cardKey;
    }
    if(scheduleKey !== lastScheduleKey){
      renderSchedule(now, st);
      lastScheduleKey = scheduleKey;
    }
    updateTz();
    if(st.phase !== 'active') return;
    $('countdown').textContent = mmss(st.remainingSec);
    $('fill').style.width = (st.progress*100).toFixed(2)+'%';
    var bar = $('bar');
    bar.setAttribute('aria-valuenow', Math.round(st.progress*100));
    bar.setAttribute('aria-valuetext', '剩余 ' + mmss(st.remainingSec));
  }

  // 初始化：先同步渲染一帧（含倒计时与进度条，首帧即出），再启动每秒刷新
  var durationHours = Math.floor(DUR_MIN/60);
  var durationMinutes = DUR_MIN%60;
  var durationLabel = (durationHours ? durationHours + ' 小时' : '')
    + (durationMinutes ? (durationHours ? ' ' : '') + durationMinutes + ' 分' : '');
  document.title = 'APEX 排位地图轮换 · 赛季 ' + SEASON.number;
  $('season-badge').textContent = '赛季 ' + SEASON.number + ' · 赛段 ' + SEASON.split
    + ' · 每张 ' + durationLabel + ' · ' + POOL.length + ' 图循环';
  tick();
  applyTheme(storedMode(), false);
  setInterval(tick, 1000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) tick(); });
})();
</script>
</body>
